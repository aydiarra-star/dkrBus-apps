<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Contrôle du tracé TER Dakar – AIBD</title>
<link rel="stylesheet" href="/leaflet/leaflet.css" />
<style>
  html, body, #map { margin: 0; height: 100%; width: 100%; }
  body { font: 13px/1.35 system-ui, sans-serif; }
  #caption { position: absolute; z-index: 1000; top: 10px; left: 10px; max-width: 560px; padding: 8px 11px; background: rgba(255,255,255,.94); border: 1px solid #333; border-radius: 4px; }
  #caption b { display: block; font-size: 14px; }
  .lbl { background: rgba(255,255,255,.94); border: 1px solid #222; border-radius: 3px; padding: 2px 6px; font: 600 12px/1.3 system-ui, sans-serif; color: #111; box-shadow: none; white-space: nowrap; }
  .lbl::before { display: none; }
  .station-mark { width: 16px; height: 16px; border: 3px solid #e60000; background: rgba(255,255,255,.35); box-sizing: border-box; transform: rotate(45deg); }
</style>
</head>
<body>
<div id="map"></div>
<div id="caption"></div>
<script src="/leaflet/leaflet.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search)
  const base = q.get('base') || 'osm'
  const lat = Number(q.get('lat')), lon = Number(q.get('lon')), z = Number(q.get('z'))
  const title = q.get('title') || ''
  const data = await (await fetch('/track.json')).json()
  const map = L.map('map', { zoomControl: false, fadeAnimation: false, zoomAnimation: false, maxZoom: 19 }).setView([lat, lon], z)
  const state = (window.__state = { ok: 0, err: 0, ready: false })
  const layers = {
    osm: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: 'Fond : © les contributeurs d’OpenStreetMap' }),
    sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagerie : © Esri, Maxar, Earthstar Geographics et la communauté SIG' }),
  }
  const tiles = layers[base]
  tiles.on('tileload', () => { state.ok += 1 })
  tiles.on('tileerror', () => { state.err += 1 })
  tiles.on('load', () => { state.ready = true })
  tiles.addTo(map)
  L.control.scale({ imperial: false, maxWidth: 200 }).addTo(map)
  map.attributionControl.setPrefix(false)
  map.attributionControl.addAttribution('Tracé TER : © les contributeurs d’OpenStreetMap (ODbL)')

  const line = base === 'sat' ? '#ffe600' : '#d4006a'
  const positions = data.coordinates.map(([x, y]) => [y, x])
  // Trait fin pour laisser voir les voies du fond ; chaque sommet du fichier est marqué.
  L.polyline(positions, { color: '#000', weight: 5, opacity: 0.35, interactive: false }).addTo(map)
  L.polyline(positions, { color: line, weight: 2, opacity: 1, interactive: false }).addTo(map)
  if (z >= 16) positions.forEach((p) => L.circleMarker(p, { radius: 3, color: '#000', weight: 1, fillColor: line, fillOpacity: 1, interactive: false }).addTo(map))

  const label = (latlng, text, direction, offset) => L.tooltip({ permanent: true, direction, offset, className: 'lbl' }).setLatLng(latlng).setContent(text).addTo(map)
  const meters = (a, b) => map.distance(a, b)
  const ends = [
    { index: 0, text: 'Sommet 0 du tracé — heurtoir OSM 7570062808', station: 'ter-dakar' },
    { index: data.phase2StartIndex, text: `Sommet ${data.phase2StartIndex} — limite phase 1 / phase 2`, station: 'ter-diamniadio' },
    { index: positions.length - 1, text: `Sommet ${positions.length - 1} du tracé — heurtoir OSM 14160412582`, station: 'ter-aibd' },
  ]
  if (z >= 16) for (const end of ends) {
    const vertex = positions[end.index]
    const station = data.stations.find((s) => s.id === end.station)
    const stationLatLng = [station.lat, station.lon]
    if (!map.getBounds().pad(0.2).contains(vertex)) continue
    L.circleMarker(vertex, { radius: 8, color: '#000', weight: 2, fillColor: line, fillOpacity: 1, interactive: false }).addTo(map)
    label(vertex, end.text, 'right', [12, -14])
    L.marker(stationLatLng, { icon: L.divIcon({ className: '', html: '<div class="station-mark"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), interactive: false }).addTo(map)
    label(stationLatLng, `Gare « ${station.name} » — position de corridors.ts`, 'left', [-14, 12])
    L.polyline([vertex, stationLatLng], { color: '#e60000', weight: 2, dashArray: '5 5', interactive: false }).addTo(map)
    const mid = [(vertex[0] + stationLatLng[0]) / 2, (vertex[1] + stationLatLng[1]) / 2]
    label(mid, `${meters(vertex, stationLatLng).toFixed(1)} m`, 'right', [10, 10])
  }
  document.getElementById('caption').innerHTML = `<b>${title}</b>Contrôle hors application · fond ${base === 'sat' ? 'imagerie satellite Esri' : 'OpenStreetMap'} · zoom ${z} · trait fin = tracé du fichier, points = sommets`
})()
</script>
</body>
</html>
