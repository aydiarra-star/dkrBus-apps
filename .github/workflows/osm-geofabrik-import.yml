name: Dakar Bus OSM import (Geofabrik)

on:
  workflow_dispatch:
  push:
    branches:
      - osm-geofabrik-run-once

permissions:
  contents: read

concurrency:
  group: dakar-bus-osm-import
  cancel-in-progress: false

jobs:
  import-dakar-candidates:
    name: Extract and stage OSM stop candidates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets before downloading
        env:
          SUPABASE_URL: ${{ secrets.DAKAR_BUS_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DAKAR_BUS_SUPABASE_PUBLISHABLE_KEY }}
          DAKAR_BUS_INGEST_TOKEN: ${{ secrets.DAKAR_BUS_INGEST_TOKEN }}
        run: |
          test -n "$SUPABASE_URL" || (echo "::error::Missing DAKAR_BUS_SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "::error::Missing DAKAR_BUS_SUPABASE_PUBLISHABLE_KEY" && exit 1)
          test -n "$DAKAR_BUS_INGEST_TOKEN" || (echo "::error::Missing DAKAR_BUS_INGEST_TOKEN" && exit 1)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OSM PBF parser
        run: python -m pip install --disable-pip-version-check osmium

      - name: Download, filter and stage Dakar bus-stop candidates
        env:
          SUPABASE_URL: ${{ secrets.DAKAR_BUS_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DAKAR_BUS_SUPABASE_PUBLISHABLE_KEY }}
          DAKAR_BUS_INGEST_TOKEN: ${{ secrets.DAKAR_BUS_INGEST_TOKEN }}
        run: python scripts/import_osm_pbf.py
