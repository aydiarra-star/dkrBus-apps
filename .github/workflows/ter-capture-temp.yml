# TEMPORAIRE — à retirer avant fusion.
# Produit les captures de contrôle du tracé TER (PR 168) depuis un poste ayant
# accès aux tuiles : fond OpenStreetMap de l'application et imagerie satellite.
name: Captures de contrôle TER (temporaire)

on:
  push:
    branches:
      - arena/77e61d28-dkrbus-apps
    paths:
      - .github/workflows/ter-capture-temp.yml
      - .github/ter-capture/**

permissions:
  contents: write

concurrency:
  group: ter-capture
  cancel-in-progress: true

jobs:
  capture:
    name: Captures de la carte
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the capture driver outside the project
        run: npm install --prefix /tmp/cap --no-audit --no-fund puppeteer-core

      - name: Capture the map
        run: |
          npm run dev -- --port 5173 --strictPort > /tmp/dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:5173/dkrBus-apps/ > /dev/null && break
            sleep 1
          done
          PUPPETEER_DIR=/tmp/cap CHROME_PATH="$(which google-chrome)" node .github/ter-capture/capture.mjs

      - name: Commit the captures to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/captures/ter-dakar-aibd
          git commit -m "Captures de contrôle du tracé TER (fond OSM et imagerie satellite)"
          git push
