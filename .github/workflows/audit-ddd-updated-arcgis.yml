name: Audit updated DDD ArcGIS service (read only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/export_ddd_updated_arcgis_service.mjs"
      - ".github/workflows/audit-ddd-updated-arcgis.yml"

permissions:
  contents: read

concurrency:
  group: ddd-updated-arcgis-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retrieve updated DDD stop and route layers
        run: node scripts/export_ddd_updated_arcgis_service.mjs
      - name: Save read-only ArcGIS evidence
        uses: actions/upload-artifact@v4
        with:
          name: ddd-updated-service-candidates
          path: artifacts/arcgis/ddd-updated-service-candidates.json
          if-no-files-found: error
          retention-days: 14
