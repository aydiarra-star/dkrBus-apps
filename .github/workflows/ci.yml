name: Dakar Bus CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Check AFTU/TATA source coverage audit
        run: node --check scripts/audit_aftu_tata_directional_coverage.mjs

      - name: Test AFTU/TATA source coverage audit
        run: node --test scripts/audit_aftu_tata_directional_coverage.node-test.mjs

      - name: Audit AFTU and TATA directional source coverage
        run: node scripts/audit_aftu_tata_directional_coverage.mjs

      - name: Upload AFTU/TATA source coverage
        uses: actions/upload-artifact@v4
        with:
          name: aftu-tata-directional-source-coverage
          path: artifacts/aftu-tata/
          if-no-files-found: error
          retention-days: 30

      - name: Check read-only DDD OSM ArcGIS reconciliation script
        run: node --check scripts/compare_ddd_osm_arcgis_stops.mjs

      - name: Check read-only OSM way to ArcGIS stop proximity exporter
        run: node --check scripts/export_ddd_osm_way_arcgis_stop_proximity.mjs

      - name: Check read-only OSM stop-node candidate exporter
        run: node --check scripts/export_ddd_osm_way_stop_node_candidates.mjs

      - name: Check official DDD route exporter
        run: node --check scripts/export_ddd_official_route_candidates.mjs

      - name: Check OSM directional pair and ambiguity audit
        run: node --check scripts/analyze_dakar_osm_directional_pairs.mjs

      - name: Extract official DDD published route sequences
        id: ddd_official
        continue-on-error: true
        run: node scripts/export_ddd_official_route_candidates.mjs

      - name: Upload official DDD route evidence
        if: always() && steps.ddd_official.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ddd-official-published-route-candidates
          path: artifacts/ddd/ddd-official-published-route-candidates.json
          if-no-files-found: error
          retention-days: 14

      - name: Check read-only DDD ArcGIS feature extractor
        run: node --check scripts/extract_ddd_arcgis_feature_layers.mjs

      - name: Extract DDD ArcGIS stop and route features (read-only)
        run: node scripts/extract_ddd_arcgis_feature_layers.mjs

      - name: Check DDD ArcGIS geometric crosswalk script
        run: node --check scripts/audit_ddd_arcgis_geometry_crosswalk.mjs

      - name: Audit DDD ArcGIS stop-to-route geometry (read-only)
        run: node scripts/audit_ddd_arcgis_geometry_crosswalk.mjs

      - name: Check DDD ArcGIS candidate sequence builder
        run: node --check scripts/build_ddd_arcgis_candidate_sequences.mjs

      - name: Test DDD ArcGIS candidate sequence builder
        run: node --test scripts/build_ddd_arcgis_candidate_sequences.node-test.mjs

      - name: Build DDD ArcGIS ordered candidate sequences
        run: node scripts/build_ddd_arcgis_candidate_sequences.mjs

      - name: Check AFTU/TATA to DDD stop-name crosswalk
        run: node --check scripts/build_aftu_tata_ddd_stop_crosswalk.node.mjs

      - name: Test AFTU/TATA to DDD stop-name crosswalk
        run: node --test scripts/build_aftu_tata_ddd_stop_crosswalk.node-test.mjs

      - name: Build AFTU/TATA to DDD stop-name crosswalk
        run: node scripts/build_aftu_tata_ddd_stop_crosswalk.node.mjs

      - name: Upload AFTU/TATA to DDD stop-name crosswalk
        uses: actions/upload-artifact@v4
        with:
          name: aftu-tata-ddd-stop-name-crosswalk
          path: artifacts/aftu-tata/
          if-no-files-found: error
          retention-days: 30
      - name: Check AFTU/TATA DDD fuzzy candidate review
        run: node --check scripts/build_aftu_tata_ddd_fuzzy_candidates.node.mjs

      - name: Test AFTU/TATA DDD fuzzy candidate review
        run: node --test scripts/build_aftu_tata_ddd_fuzzy_candidates.node-test.mjs

      - name: Build AFTU/TATA DDD fuzzy candidate review
        run: node scripts/build_aftu_tata_ddd_fuzzy_candidates.node.mjs

      - name: Upload AFTU/TATA DDD fuzzy candidate review
        uses: actions/upload-artifact@v4
        with:
          name: aftu-tata-ddd-fuzzy-review
          path: artifacts/aftu-tata/ddd-fuzzy-review-*
          if-no-files-found: error
          retention-days: 30
      - name: Check AFTU/TATA OSM stop crosswalk
        run: node --check scripts/build_aftu_tata_osm_stop_crosswalk.node.mjs

      - name: Test AFTU/TATA OSM stop crosswalk
        run: node --test scripts/build_aftu_tata_osm_stop_crosswalk.node-test.mjs

      - name: Check DDD ArcGIS official sequence cross-check
        run: node --check scripts/audit_ddd_arcgis_official_sequence_alignment.mjs

      - name: Test DDD ArcGIS official sequence cross-check
        run: node --test scripts/audit_ddd_arcgis_official_sequence_alignment.node-test.mjs

      - name: Compare candidate sequences with published DDD routes
        run: node scripts/audit_ddd_arcgis_official_sequence_alignment.mjs

      - name: Upload DDD ArcGIS ordered candidate sequences
        uses: actions/upload-artifact@v4
        with:
          name: ddd-arcgis-ordered-candidate-sequences
          path: artifacts/ddd/arcgis-2024-candidate-sequences/
          if-no-files-found: error
          retention-days: 30

      - name: Upload ArcGIS stop-to-route crosswalk and audit
        uses: actions/upload-artifact@v4
        with:
          name: ddd-arcgis-stop-route-crosswalk
          path: artifacts/ddd/arcgis-2024-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Upload raw ArcGIS and GeoJSON evidence
        uses: actions/upload-artifact@v4
        with:
          name: ddd-arcgis-2024-source-extract
          path: artifacts/ddd/arcgis-2024-extract/
          if-no-files-found: error
          retention-days: 30

      - name: Check pedestrian graph extractor
        run: node --check scripts/export_dakar_pedestrian_network.mjs

      - name: Test pedestrian graph construction and access filters
        run: node --test scripts/lib/pedestrianNetwork.node-test.mjs

      - name: Check pedestrian source selection helper
        run: node --check scripts/lib/pedestrianSource.mjs

      - name: Test local PBF and Overpass source selection
        run: node --test scripts/lib/pedestrianSource.node-test.mjs

      - name: Test Geofabrik pedestrian PBF filter
        run: python scripts/test_extract_dakar_pedestrian_ways_from_pbf.py

      - name: Build candidate pedestrian graph from Geofabrik PBF (preferred source)
        id: pedestrian_geofabrik
        continue-on-error: true
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool
          python -m pip install --disable-pip-version-check osmium
          mkdir -p artifacts/pedestrian
          if ! curl --fail --location --retry 2 --retry-delay 5 \
            https://download.geofabrik.de/africa/senegal-and-gambia-latest.osm.pbf \
            --output artifacts/pedestrian/senegal-and-gambia.osm.pbf; then
            rm -f artifacts/pedestrian/senegal-and-gambia.osm.pbf
            curl --fail --location --retry 2 --retry-delay 5 \
              https://data.bbbike.org/osm/pbf/region/africa/senegal-and-gambia.osm.pbf \
              --output artifacts/pedestrian/senegal-and-gambia.osm.pbf
          fi
          osmium extract --bbox -17.60,14.50,-17.05,14.95 --strategy complete_ways \
            -o artifacts/pedestrian/dakar.osm.pbf artifacts/pedestrian/senegal-and-gambia.osm.pbf --overwrite
          python scripts/extract_dakar_pedestrian_ways_from_pbf.py \
            artifacts/pedestrian/dakar.osm.pbf artifacts/pedestrian/dakar-pedestrian-ways.json
          DAKAR_OSM_WAYS_JSON=artifacts/pedestrian/dakar-pedestrian-ways.json \
            node scripts/export_dakar_pedestrian_network.mjs

      - name: Extract candidate Dakar pedestrian graph from Overpass when Geofabrik is unavailable
        id: pedestrian_graph
        if: steps.pedestrian_geofabrik.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/export_dakar_pedestrian_network.mjs

      - name: Upload candidate pedestrian graph
        if: always() && (steps.pedestrian_geofabrik.outcome == 'success' || steps.pedestrian_graph.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: dakar-pedestrian-graph-candidate
          path: artifacts/pedestrian/dakar-pedestrian-graph-candidate.json
          if-no-files-found: error
          retention-days: 14

      - name: Build frontend
        run: npm run build

      - name: Run frontend and local data tests (no GTFS feed required)
        run: npm run test:all

      - name: Audit dependencies
        run: npm audit --audit-level=moderate


  osm_evidence:
    name: Optional DDD OSM relation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check read-only OSM directional relation extractor
        run: node --check scripts/extract_ddd_osm_directional_relations.mjs

      - name: Query OSM relations for DDD lines 217, 218, 219 and 228 (read-only)
        id: osm_relations
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/extract_ddd_osm_directional_relations.mjs

      - name: Upload OSM directional relation evidence
        if: always() && steps.osm_relations.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ddd-osm-217-218-219-228
          path: artifacts/ddd/osm-217-218-219-228/
          if-no-files-found: error
          retention-days: 30

  anat_road_evidence:
    name: Optional official ANAT road and sidewalk source inspection
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - name: Prepare Geosenegal evidence folders
        run: mkdir -p artifacts/geosenegal/downloads artifacts/geosenegal/unpacked

      - name: Download Dakar 2019 street and sidewalk geometry
        continue-on-error: true
        timeout-minutes: 3
        run: |
          curl --fail --location --retry 2 --retry-delay 3 --connect-timeout 15 --max-time 180 \
            --user-agent "DakarBus-read-only-source-audit/1.0" \
            https://www.geosenegal.gouv.sn/IMG/zip/terra_voirie_bdu_dakar_2019.zip \
            --output artifacts/geosenegal/downloads/dakar-voirie-2019.zip
          unzip -t artifacts/geosenegal/downloads/dakar-voirie-2019.zip

      - name: Download Guediawaye 2019 street and sidewalk geometry
        continue-on-error: true
        timeout-minutes: 3
        run: |
          curl --fail --location --retry 2 --retry-delay 3 --connect-timeout 15 --max-time 180 \
            --user-agent "DakarBus-read-only-source-audit/1.0" \
            https://www.geosenegal.gouv.sn/IMG/zip/terra_voirie_bdu_guediawaye_2019.zip \
            --output artifacts/geosenegal/downloads/guediawaye-voirie-2019.zip
          unzip -t artifacts/geosenegal/downloads/guediawaye-voirie-2019.zip

      - name: Download Pikine-Guediawaye 2014 street geometry
        continue-on-error: true
        timeout-minutes: 3
        run: |
          curl --fail --location --retry 1 --retry-delay 3 --connect-timeout 15 --max-time 180 \
            --user-agent "DakarBus-read-only-source-audit/1.0" \
            https://www.geosenegal.gouv.sn/IMG/zip/voiriezip-adada1.zip \
            --output artifacts/geosenegal/downloads/pikine-guediawaye-voirie-2014.zip
          unzip -t artifacts/geosenegal/downloads/pikine-guediawaye-voirie-2014.zip

      - name: Download Pikine-Guediawaye 2014 railway geometry
        continue-on-error: true
        timeout-minutes: 3
        run: |
          curl --fail --location --retry 1 --retry-delay 3 --connect-timeout 15 --max-time 180 \
            --user-agent "DakarBus-read-only-source-audit/1.0" \
            https://www.geosenegal.gouv.sn/IMG/zip/chemin_ferzi3624.zip \
            --output artifacts/geosenegal/downloads/pikine-guediawaye-rail-2014.zip
          unzip -t artifacts/geosenegal/downloads/pikine-guediawaye-rail-2014.zip

      - name: Inspect downloaded SHP layer inventory
        if: always()
        run: |
          for archive in artifacts/geosenegal/downloads/*.zip; do
            [ -f "$archive" ] || continue
            name="$(basename "$archive" .zip)"
            mkdir -p "artifacts/geosenegal/unpacked/$name"
            unzip -o -q "$archive" -d "artifacts/geosenegal/unpacked/$name" || true
          done
          if find artifacts/geosenegal/unpacked -name '*.shp' -print -quit | grep -q .; then
            python -m pip install --disable-pip-version-check pyshp
            python - <<'PY'
          from pathlib import Path
          import json
          import shapefile

          root = Path("artifacts/geosenegal/unpacked")
          inventory = []
          for shp in sorted(root.rglob("*.shp")):
              try:
                  reader = shapefile.Reader(str(shp))
                  inventory.append({
                      "file": str(shp),
                      "featureCount": len(reader),
                      "shapeType": reader.shapeType,
                      "bbox": list(reader.bbox) if reader.bbox else None,
                      "fields": [field[0] for field in reader.fields[1:]],
                  })
              except Exception as exc:
                  inventory.append({"file": str(shp), "error": str(exc)})
          out = Path("artifacts/geosenegal/shapefile-inventory.json")
          out.write_text(json.dumps(inventory, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(inventory, ensure_ascii=False, indent=2))
          PY
          else
            echo "Aucun SHP téléchargé ; consulter les résultats des téléchargements dans les logs."
          fi

      - name: Upload official ANAT source archives and inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geosenegal-anat-road-sidewalk-source-audit
          path: artifacts/geosenegal/
          if-no-files-found: ignore
          retention-days: 30
