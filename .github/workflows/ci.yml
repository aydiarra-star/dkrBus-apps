name: Dakar Bus CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend and local data tests (no GTFS feed required)
        run: npm run test:all

      - name: Import OSM Dakar stops (one-time collection branch)
        if: github.ref == 'refs/heads/osm-geofabrik-run-once'
        env:
          SUPABASE_URL: https://mdmuxzaewqzqutkqdylo.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_YsnzMxuSKWCLhtyMWhHncA_bDeWUt3J
          DAKAR_BUS_INGEST_TOKEN: ${{ secrets.DAKAR_BUS_INGEST_TOKEN }}
        run: |
          test -n "$DAKAR_BUS_INGEST_TOKEN" || (echo "::error::Missing DAKAR_BUS_INGEST_TOKEN" && exit 1)
          python -m pip install --disable-pip-version-check osmium
          python scripts/import_osm_pbf.py

      - name: Check OSM importer Python syntax
        run: python -m py_compile scripts/import_osm_pbf.py

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
