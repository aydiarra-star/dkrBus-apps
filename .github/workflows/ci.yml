name: Dakar Bus CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend and local data tests (no GTFS feed required)
        run: npm run test:all

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  verify-gtfs-ingest:
    name: Verify private GTFS ingest function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test bounded multipart upload parsing
        run: deno test supabase/functions/dakar-gtfs-ingest/multipart_test.ts

      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/dakar-admin/index.ts supabase/functions/dakar-gtfs-ingest/index.ts
