name: Dakar Bus CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pbf_available: ${{ steps.relation_artifact.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Run GTFS validator and worker unit tests
        run: python -m unittest tests.test_compare_weekly_73 tests.test_hub_access tests.test_bus_board_profiles tests.test_validate_gtfs tests.test_process_gtfs_staging tests.test_audit_bus_continuity tests.test_audit_interchange_sites tests.test_audit_maristes_pins tests.test_physical_bus_review tests.test_terminus_quays tests.test_terminal_calls tests.test_reference_archives tests.test_thiaroye_site tests.test_freeze_bus_checks tests.test_audit_aftu_road_fit tests.test_audit_aftu_map_calls tests.test_gtfs_worker_workflow tests.test_extract_dakar_bus_route_relations_from_pbf tests.test_compare_dakar_pbf_ddd_arcgis_routes

      # The stop-sheet parser is tested above with fixtures. Do not poll six
      # third-party passenger pages on every PR in lieu of reuse permission.
      - name: Install dependencies
        run: npm ci

      - name: Verify offline bus inventory and versioned coverage table
        run: |
          # Recalculate at the pinned date. A changed route, selection, leg time
          # or classification must not silently leave yesterday's receipt green.
          node scripts/audit_reference_surface.mjs --check
          node scripts/audit_place_connections.mjs --matrix --at 2026-11-19T19:00 > "$RUNNER_TEMP/bus-day.json"
          cmp data/bus-review/replay-calculateur-2026-11-19.json "$RUNNER_TEMP/bus-day.json"
          node scripts/audit_place_connections.mjs --matrix --at 2026-11-19T19:00 --points data/bus-sections/selection-0c6cf56.json > "$RUNNER_TEMP/cohort.json"
          cmp data/bus-review/replay-calculateur-144-2026-11-19.json "$RUNNER_TEMP/cohort.json"
          node scripts/audit_place_connections.mjs --matrix --at 2026-11-19T19:00 --points data/bus-sections/selection-1c720c6.json > "$RUNNER_TEMP/cohort150.json"
          cmp data/bus-review/replay-calculateur-150-2026-11-19.json "$RUNNER_TEMP/cohort150.json"
          node scripts/audit_transfer_modes.mjs --at 2026-11-19T19:00 > "$RUNNER_TEMP/modes.json"
          cmp data/bus-review/replay-reseaux-2026-11-19.json "$RUNNER_TEMP/modes.json"
          for time in 05:00 19:00; do
            node scripts/audit_timetable_advice.mjs --at "2026-11-19T$time" > "$RUNNER_TEMP/hours.json"
            cmp "data/bus-review/horaires-maristes-2026-11-19-${time/:/}.json" "$RUNNER_TEMP/hours.json"
          done
          node scripts/audit_bus_boards.mjs --markdown "$RUNNER_TEMP/bus-boards.md"
          cmp docs/passages-bus-par-ligne.md "$RUNNER_TEMP/bus-boards.md"
          node scripts/audit_bus_signs.mjs --dir "$RUNNER_TEMP/panneaux"
          diff -ru docs/panneaux "$RUNNER_TEMP/panneaux"
          python -m scripts.audit_bus_gaps --boards "$RUNNER_TEMP/panneaux" --output "$RUNNER_TEMP/lacunes"
          diff -ru docs/lacunes "$RUNNER_TEMP/lacunes"
          npm run audit:bus-screen
          node scripts/audit_passenger_transfers.mjs --at 2026-11-19T19:00 --markdown > "$RUNNER_TEMP/pieces.md"
          cmp docs/pieces-par-sens.md "$RUNNER_TEMP/pieces.md"

      - name: Check AFTU/TATA source coverage audit
        run: node --check scripts/audit_aftu_tata_directional_coverage.mjs

      - name: Audit AFTU and TATA directional source coverage
        run: node scripts/audit_aftu_tata_directional_coverage.mjs

      - name: Upload AFTU/TATA source coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aftu-tata-directional-source-coverage
          path: artifacts/aftu-tata/
          if-no-files-found: error
          retention-days: 30

      - name: Check read-only DDD OSM ArcGIS reconciliation script
        run: node --check scripts/compare_ddd_osm_arcgis_stops.mjs

      - name: Check read-only OSM way to ArcGIS stop proximity exporter
        run: node --check scripts/export_ddd_osm_way_arcgis_stop_proximity.mjs

      - name: Check read-only OSM stop-node candidate exporter
        run: node --check scripts/export_ddd_osm_way_stop_node_candidates.mjs

      - name: Check official DDD route exporter
        run: node --check scripts/export_ddd_official_route_candidates.mjs

      - name: Check OSM directional pair and ambiguity audit
        run: node --check scripts/analyze_dakar_osm_directional_pairs.mjs

      - name: Extract official DDD published route sequences
        id: ddd_official
        continue-on-error: true
        run: node scripts/export_ddd_official_route_candidates.mjs

      - name: Upload official DDD route evidence
        if: always() && steps.ddd_official.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddd-official-published-route-candidates
          path: artifacts/ddd/ddd-official-published-route-candidates.json
          if-no-files-found: error
          retention-days: 14

      - name: Check read-only DDD ArcGIS feature extractor
        run: node --check scripts/extract_ddd_arcgis_feature_layers.mjs

      - name: Extract DDD ArcGIS stop and route features (read-only)
        run: node scripts/extract_ddd_arcgis_feature_layers.mjs

      - name: Check DDD ArcGIS geometric crosswalk script
        run: node --check scripts/audit_ddd_arcgis_geometry_crosswalk.mjs

      - name: Audit DDD ArcGIS stop-to-route geometry (read-only)
        run: node scripts/audit_ddd_arcgis_geometry_crosswalk.mjs

      - name: Check DDD ArcGIS candidate sequence builder
        run: node --check scripts/build_ddd_arcgis_candidate_sequences.mjs

      - name: Build DDD ArcGIS ordered candidate sequences
        run: node scripts/build_ddd_arcgis_candidate_sequences.mjs

      - name: Check AFTU/TATA to DDD stop-name crosswalk
        run: node --check scripts/build_aftu_tata_ddd_stop_crosswalk.node.mjs

      - name: Build AFTU/TATA to DDD stop-name crosswalk
        run: node scripts/build_aftu_tata_ddd_stop_crosswalk.node.mjs

      - name: Upload AFTU/TATA to DDD stop-name crosswalk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aftu-tata-ddd-stop-name-crosswalk
          path: artifacts/aftu-tata/
          if-no-files-found: error
          retention-days: 30
      - name: Check AFTU/TATA DDD fuzzy candidate review
        run: node --check scripts/build_aftu_tata_ddd_fuzzy_candidates.node.mjs

      - name: Build AFTU/TATA DDD fuzzy candidate review
        run: node scripts/build_aftu_tata_ddd_fuzzy_candidates.node.mjs

      - name: Upload AFTU/TATA DDD fuzzy candidate review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aftu-tata-ddd-fuzzy-review
          path: artifacts/aftu-tata/ddd-fuzzy-review-*
          if-no-files-found: error
          retention-days: 30
      - name: Check AFTU/TATA OSM stop crosswalk
        run: node --check scripts/build_aftu_tata_osm_stop_crosswalk.node.mjs

      - name: Check DDD ArcGIS official sequence cross-check
        run: node --check scripts/audit_ddd_arcgis_official_sequence_alignment.mjs

      - name: Compare candidate sequences with published DDD routes
        run: node scripts/audit_ddd_arcgis_official_sequence_alignment.mjs

      - name: Upload DDD ArcGIS ordered candidate sequences
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddd-arcgis-ordered-candidate-sequences
          path: artifacts/ddd/arcgis-2024-candidate-sequences/
          if-no-files-found: error
          retention-days: 30

      - name: Upload ArcGIS stop-to-route crosswalk and audit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddd-arcgis-stop-route-crosswalk
          path: artifacts/ddd/arcgis-2024-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Upload raw ArcGIS and GeoJSON evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddd-arcgis-2024-source-extract
          path: artifacts/ddd/arcgis-2024-extract/
          if-no-files-found: error
          retention-days: 30

      - name: Check pedestrian graph extractor
        run: node --check scripts/export_dakar_pedestrian_network.mjs
      - name: Check Dakar bus route relation PBF extractor
        run: python -m py_compile scripts/extract_dakar_bus_route_relations_from_pbf.py
      - name: Check DDD OSM-ArcGIS directional crosswalk
        run: python -m py_compile scripts/compare_dakar_pbf_ddd_arcgis_routes.py

      - name: Check pedestrian source selection helper
        run: node --check scripts/lib/pedestrianSource.mjs

      - name: Test Geofabrik pedestrian PBF filter
        run: python scripts/test_extract_dakar_pedestrian_ways_from_pbf.py

      - name: Build candidate pedestrian graph from Geofabrik PBF (preferred source)
        id: pedestrian_geofabrik
        continue-on-error: true
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool
          python -m pip install --disable-pip-version-check osmium
          mkdir -p artifacts/pedestrian
          pbf_url=https://download.geofabrik.de/africa/senegal-and-gambia-latest.osm.pbf
          if ! curl --fail --location --retry 2 --retry-delay 5 "$pbf_url" \
            --output artifacts/pedestrian/senegal-and-gambia.osm.pbf; then
            rm -f artifacts/pedestrian/senegal-and-gambia.osm.pbf
            pbf_url=https://data.bbbike.org/osm/pbf/region/africa/senegal-and-gambia.osm.pbf
            curl --fail --location --retry 2 --retry-delay 5 "$pbf_url" \
              --output artifacts/pedestrian/senegal-and-gambia.osm.pbf
          fi
          echo "source_url=$pbf_url" >> "$GITHUB_OUTPUT"
          osmium extract --bbox -17.60,14.50,-17.05,14.95 --strategy complete_ways \
            -o artifacts/pedestrian/dakar.osm.pbf artifacts/pedestrian/senegal-and-gambia.osm.pbf --overwrite
          python scripts/extract_dakar_pedestrian_ways_from_pbf.py \
            artifacts/pedestrian/dakar.osm.pbf artifacts/pedestrian/dakar-pedestrian-ways.json
          DAKAR_OSM_WAYS_JSON=artifacts/pedestrian/dakar-pedestrian-ways.json \
            node scripts/export_dakar_pedestrian_network.mjs

      - name: Extract Dakar bus route relation candidates from the same OSM PBF
        id: dakar_bus_routes
        if: steps.pedestrian_geofabrik.outcome == 'success'
        timeout-minutes: 10
        run: |
          mkdir -p artifacts/bus-review
          node scripts/audit_bus_networks.mjs --output artifacts/bus-review/inventory.json
          python scripts/extract_dakar_bus_route_relations_from_pbf.py artifacts/pedestrian/senegal-and-gambia.osm.pbf artifacts/pedestrian/dakar-bus-route-relations.json --inventory artifacts/bus-review/inventory.json --source-url '${{ steps.pedestrian_geofabrik.outputs.source_url }}'
          python -m scripts.audit_bus_osm_occurrences artifacts/bus-review/inventory.json artifacts/pedestrian/dakar-bus-route-relations.json artifacts/bus-review/occurrences.json --ci-summary
          python -m scripts.audit_bus_continuity artifacts/pedestrian/dakar-bus-route-relations.json artifacts/bus-review/continuity.json --ci-summary

      - name: Check platform paths at the ten sites and search the full Dakar extract for inter-network candidates
        if: steps.pedestrian_geofabrik.outcome == 'success'
        run: python -m scripts.audit_interchange_sites artifacts/pedestrian/dakar.osm.pbf artifacts/bus-review/interchange-sites.json --regional artifacts/bus-review/interchange-region.json --ci-summary

      # Report regional measurements separately from the site windows.
      - name: Report regional candidates and incomplete walks (not passenger transfers)
        if: steps.pedestrian_geofabrik.outcome == 'success'
        run: |
          file=artifacts/bus-review/interchange-region.json
          jq -cr '"::notice title=Topologie régionale quais::" + ({extractSha256,platforms,touching,directedPaths:(.directedPaths|length),shared:(.sameObjectByRole|length),betweenRoles:(.pathsBetweenRouteRoles|length)}|tojson)' "$file"
          jq -cr '"::notice title=Rôles interréseaux::" + ({sameObjectByRole,pathsBetweenRouteRoles}|tojson|gsub("%";"%25"))' "$file"
          # A check annotation is truncated at 4096 characters. Full regional
          # paths and labels stay in the artifact. Report this pair separately.
          jq -cr '"::notice title=Patte d’Oie entre poteaux::" + ([.directedPaths[]|select((.[:2]|sort)==["n4697843990","n4697855389"])]|tojson)' "$file"
          jq -cr '.labels as $l | [.directedPaths[] | select(any(.[:2][]; $l[.][2] != "SunuBRT"))] | "::notice title=Chemins hors paires SunuBRT::" + ({total:length,first:.[0:12]}|tojson)' "$file"
          jq -cr '"::notice title=Approches partielles::" + (.surveyApproaches|tojson)' "$file"

      - name: Upload read-only bus occurrence and pinned member comparison
        if: steps.dakar_bus_routes.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dakar-bus-occurrence-review
          path: artifacts/bus-review/
          if-no-files-found: error
          retention-days: 14

      - name: Extract candidate Dakar pedestrian graph from Overpass when Geofabrik is unavailable
        id: pedestrian_graph
        if: steps.pedestrian_geofabrik.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/export_dakar_pedestrian_network.mjs

      - name: Upload candidate pedestrian graph
        if: always() && (steps.pedestrian_geofabrik.outcome == 'success' || steps.pedestrian_graph.outcome == 'success')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dakar-pedestrian-graph-candidate
          path: artifacts/pedestrian/dakar-pedestrian-graph-candidate.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Dakar bus route relation audit
        id: relation_artifact
        if: steps.dakar_bus_routes.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dakar-bus-route-relations
          path: artifacts/pedestrian/dakar-bus-route-relations.json
          if-no-files-found: error
          retention-days: 30

      - name: Build frontend
        run: npm run build

      - name: Chromium — 70 reference choices, 37 stations, map layers, bus boards and journeys
        env:
          BROWSER_TOOLS: ${{ runner.temp }}/map-browser
        run: |
          npm install --prefix "$BROWSER_TOOLS" --no-save --ignore-scripts playwright-core@1.65.1
          CHROMIUM_PATH="$(command -v google-chrome)" npm run smoke:arena

      - name: Run frontend and local data tests (no GTFS feed required)
        run: npm run test:all

      - name: Audit runtime dependencies and build/test tooling
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high

  verify-gtfs-worker-migration:
    name: Verify private GTFS worker database migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dakar_bus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dakar_bus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply isolated Supabase schema fixtures and migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dakar_bus_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/bootstrap_supabase.sql -f supabase/migrations/20261113090000_dakar_admin_foundation.sql -f supabase/migrations/20261113100000_dakar_private_gtfs_staging.sql -f supabase/migrations/20261113110000_dakar_gtfs_validation_worker.sql -f supabase/migrations/20261113120000_dakar_gtfs_validation_integrity_guards.sql -f tests/sql/seed_legacy_dakar_admin_audit_event.sql -f supabase/migrations/20261114180000_dakar_admin_audit_hash_chain.sql -f supabase/migrations/20261114190000_dakar_gtfs_staging_least_privilege.sql -f supabase/migrations/20261114193000_dakar_gtfs_storage_isolation.sql -f supabase/migrations/20261115190000_dakar_gtfs_validation_failure_requeue.sql -f supabase/migrations/20261116200000_dakar_gtfs_worker_identity_isolation.sql -f supabase/migrations/20261119190000_dakar_gtfs_signed_upload_sessions.sql -f supabase/migrations/20261119200000_dakar_gtfs_terminal_integrity_failures.sql -f supabase/migrations/20261120210000_dakar_gtfs_upload_cleanup_claim.sql -f tests/sql/test_gtfs_upload_sessions.sql -f tests/sql/test_gtfs_upload_cleanup.sql -f tests/sql/test_gtfs_storage_isolation.sql -f tests/sql/test_gtfs_service_role_privileges.sql -f tests/sql/test_gtfs_validation_worker.sql -f tests/sql/test_gtfs_validation_failure_requeue.sql -f tests/sql/test_gtfs_validation_terminal_failures.sql
          bash tests/sql/test_gtfs_worker_claim_concurrency.sh
          bash tests/sql/test_gtfs_upload_cleanup_concurrency.sh
          bash tests/sql/test_dakar_admin_audit_concurrency.sh

  verify-gtfs-ingest:
    name: Verify private GTFS ingest function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Test bounded intake request parsing and signed upload helpers
        run: deno test supabase/functions/dakar-gtfs-ingest/multipart_test.ts supabase/functions/dakar-gtfs-ingest/upload_test.ts

      - name: Test dedicated Dakar Bus Supabase project guard
        run: deno test supabase/functions/dakar-gtfs-ingest/project_test.ts

      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/dakar-admin/index.ts supabase/functions/dakar-gtfs-ingest/index.ts


  osm_evidence:
    name: Optional DDD OSM relation evidence
    needs: verify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check read-only OSM directional relation extractor
        run: node --check scripts/extract_ddd_osm_directional_relations.mjs

      - name: Retrieve the PBF relation extract from this run, if available
        if: needs.verify.outputs.pbf_available == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dakar-bus-route-relations
          path: ${{ runner.temp }}/pbf-relations

      - name: Query Overpass; on outage inspect the same-run PBF or record unavailability
        timeout-minutes: 4
        env:
          PBF_AVAILABLE: ${{ needs.verify.outputs.pbf_available }}
        run: |
          if [[ "$PBF_AVAILABLE" == true ]]; then
            export DAKAR_OSM_RELATIONS_JSON="$RUNNER_TEMP/pbf-relations/dakar-bus-route-relations.json"
          fi
          node scripts/extract_ddd_osm_directional_relations.mjs || {
            status=$?
            if [[ "$status" != 75 ]]; then exit "$status"; fi
            echo '::warning title=Source OSM facultative indisponible::Ni réponse Overpass ni extrait PBF dans ce run. Aucune conclusion de desserte.'
          }

      - name: Upload OSM evidence or its explicit source outage diagnostic
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddd-osm-217-218-219-228
          path: artifacts/ddd/osm-217-218-219-228/
          if-no-files-found: error
          retention-days: 30
