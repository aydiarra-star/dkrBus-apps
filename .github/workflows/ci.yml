name: Dakar Bus CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GTFS validator and worker unit tests
        run: python -m unittest tests.test_validate_gtfs tests.test_process_gtfs_staging tests.test_gtfs_worker_workflow

      - name: Install dependencies
        run: npm ci

      - name: Check read-only DDD OSM ArcGIS reconciliation script
        run: node --check scripts/compare_ddd_osm_arcgis_stops.mjs

      - name: Check read-only OSM way to ArcGIS stop proximity exporter
        run: node --check scripts/export_ddd_osm_way_arcgis_stop_proximity.mjs

      - name: Check read-only OSM stop-node candidate exporter
        run: node --check scripts/export_ddd_osm_way_stop_node_candidates.mjs

      - name: Check official DDD route exporter
        run: node --check scripts/export_ddd_official_route_candidates.mjs

      - name: Check OSM directional pair and ambiguity audit
        run: node --check scripts/analyze_dakar_osm_directional_pairs.mjs

      - name: Extract official DDD published route sequences
        id: ddd_official
        continue-on-error: true
        run: node scripts/export_ddd_official_route_candidates.mjs

      - name: Upload official DDD route evidence
        if: always() && steps.ddd_official.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ddd-official-published-route-candidates
          path: artifacts/ddd/ddd-official-published-route-candidates.json
          if-no-files-found: error
          retention-days: 14

      - name: Build frontend
        run: npm run build

      - name: Run frontend and local data tests (no GTFS feed required)
        run: npm run test:all

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  verify-gtfs-worker-migration:
    name: Verify private GTFS worker database migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dakar_bus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dakar_bus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply isolated Supabase schema fixtures and migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dakar_bus_test
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/bootstrap_supabase.sql -f supabase/migrations/20261113090000_dakar_admin_foundation.sql -f supabase/migrations/20261113100000_dakar_private_gtfs_staging.sql -f supabase/migrations/20261113110000_dakar_gtfs_validation_worker.sql -f supabase/migrations/20261113120000_dakar_gtfs_validation_integrity_guards.sql -f tests/sql/seed_legacy_dakar_admin_audit_event.sql -f supabase/migrations/20261114180000_dakar_admin_audit_hash_chain.sql -f tests/sql/test_gtfs_validation_worker.sql

  verify-gtfs-ingest:
    name: Verify private GTFS ingest function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test bounded multipart upload parsing
        run: deno test supabase/functions/dakar-gtfs-ingest/multipart_test.ts

      - name: Type-check Supabase Edge Functions
        run: deno check supabase/functions/dakar-admin/index.ts supabase/functions/dakar-gtfs-ingest/index.ts
