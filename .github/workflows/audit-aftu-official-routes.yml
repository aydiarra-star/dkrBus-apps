name: Audit official AFTU route pages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/lib/waymarkLines*"
      - "scripts/audit_aftu_road_fit.py"
      - "scripts/audit_aftu_map_calls.py"
      - "scripts/audit_gt54.py"
      - "scripts/audit_patte_doie.py"
      - "scripts/audit_terminus_quays.py"
      - "data/bus-review/patte-doie-occurrences.json"
      - "scripts/medina_phase.py"
      - "data/bus-sections/gt54-pins.json"
      - "scripts/compare_bus_occurrences.py"
      - "scripts/export_aftu_official_routes.mjs"
      - ".github/workflows/audit-aftu-official-routes.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/lib/waymarkLines.node-test.mjs
      - name: Retrieve official AFTU route pages
        run: AFTU_TEMP_MAPS="$RUNNER_TEMP/aftu-maps" node scripts/export_aftu_official_routes.mjs
      - name: Report overlay measurements (not passenger geometry)
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const r = JSON.parse(readFileSync('artifacts/aftu/aftu-official-route-pages.json'));
          // One compact receipt per batch, no redistribution of point arrays.
          console.log(`::notice title=Acquisition AFTU::${r.status} · ${r.summary.pagesFetched} pages · ${r.errors.length} erreurs`);
          console.log('::notice title=Pages AFTU non acquises::'+JSON.stringify(r.errors.map(e => [e.slug,e.error])).replaceAll('%','%25'));
          const rows = r.routes.map(({line,mapReview:m}) => [line,m.status,m.markers,m.lines?.map(l => [l.vertices,l.meters,l.maxStepM,l.over300?.length,l.endpoints,l.markerOffsetsM,l.shapeHash]),m.sha256,m.other,m.markerNames]);
          for (let i = 0; i < rows.length; i+=10) console.log('::notice title=Cartes AFTU::'+JSON.stringify(rows.slice(i,i+10)).replaceAll('%','%25'));
          JS
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check directed road continuity of the acquired AFTU drawings
        if: hashFiles('artifacts/aftu/aftu-official-route-pages.json') != ''
        run: |
          if ! test -d "$RUNNER_TEMP/aftu-maps"; then
            echo '::warning::Aucune géométrie AFTU acquise : contrôle de voirie non exécuté.'
            exit 0
          fi
          python -m pip install osmium
          pbf="$RUNNER_TEMP/senegal.osm.pbf"
          source=https://download.geofabrik.de/africa/senegal-and-gambia-latest.osm.pbf
          if ! curl -fLsS --retry 2 "$source" -o "$pbf"; then
            source=https://data.bbbike.org/osm/pbf/region/africa/senegal-and-gambia.osm.pbf
            curl -fLsS --retry 2 "$source" -o "$pbf"
          fi
          python -m scripts.audit_aftu_road_fit "$pbf" "$RUNNER_TEMP/aftu-maps" artifacts/aftu/road-fit.json --source-url "$source"
      - name: Compare actual directional AFTU terminal markers with named OSM platform nodes across Dakar
        run: |
          if test -s "$RUNNER_TEMP/senegal.osm.pbf" && test -d "$RUNNER_TEMP/aftu-maps"; then
            python -m scripts.audit_terminus_quays "$RUNNER_TEMP/senegal.osm.pbf" "$RUNNER_TEMP/aftu-maps" artifacts/aftu/terminus-quays.json --ci-summary
          else
            echo '::warning::Comparaison des terminus non exécutée (PBF ou dessins manquants).'
          fi
      - name: Check historical call roles at GT-54 and Patte d’Oie and independent approach phases at Médina
        run: |
          base='https://api.github.com/repos/impactsolutionsas/passbi_core/contents/gtfs_folder'
          ref=7a2b99824699cb10daf69852c8fbecb746200d77
          for file in AFTU Dem_Dikk; do
            curl -fLsS --retry 2 -H 'Accept: application/vnd.github.raw+json' "$base/gtfs_$file.zip?ref=$ref" -o "$RUNNER_TEMP/$file.zip"
          done
          ddd="$RUNNER_TEMP/Dem_Dikk.zip"
          python -m scripts.audit_gt54 "$ddd" "$RUNNER_TEMP/AFTU.zip" > artifacts/aftu/gt54.json
          cmp data/bus-review/gt54-occurrences.json artifacts/aftu/gt54.json
          python -m scripts.audit_patte_doie "$ddd" "$RUNNER_TEMP/AFTU.zip" > artifacts/aftu/patte-doie.json
          cmp data/bus-review/patte-doie-occurrences.json artifacts/aftu/patte-doie.json
          test "$(python -m scripts.medina_phase "$ddd")" = '119 2097 3518 4645'
          test "$(python -m scripts.medina_phase "$ddd" --direction inbound)" = '89 631 1066 1355'
      - name: Compare every archived call sequence with the one marked map direction
        run: |
          if test -d "$RUNNER_TEMP/aftu-maps"; then
            python -m scripts.audit_aftu_map_calls "$RUNNER_TEMP/aftu-maps" "$RUNNER_TEMP/AFTU.zip" artifacts/aftu/archived-call-fit.json
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.audit_gt54 import drawing_control
          f = Path(os.environ['RUNNER_TEMP']) / 'aftu-maps/39.json'
          r = drawing_control(json.loads(f.read_text())) if f.exists() else {'status':'DESSIN_NON_ACQUIS'}
          print('::notice title=Rue GT-54 sur le dessin marqué 39::'+json.dumps(r))
          PY
      - name: Save route audit
        if: always() && hashFiles('artifacts/aftu/aftu-official-route-pages.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: aftu-official-route-pages
          path: artifacts/aftu/
          if-no-files-found: error
          retention-days: 14
