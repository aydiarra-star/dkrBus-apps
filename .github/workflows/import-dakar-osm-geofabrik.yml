name: Import Dakar OSM bus stops from Geofabrik

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/import_dakar_osm_geofabrik.mjs"
      - ".github/workflows/import-dakar-osm-geofabrik.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: dakar-bus-osm-geofabrik-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Supabase OIDC authentication before OSM download
        env:
          DAKAR_BUS_PUBLISHABLE_KEY: ${{ secrets.DAKAR_BUS_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.DAKAR_BUS_PUBLISHABLE_KEY ?? "";
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!key || !requestUrl || !requestToken) throw new Error("Missing OIDC or Supabase publishable credentials.");
          const oidcUrl = new URL(requestUrl);
          oidcUrl.searchParams.set("audience", "dakar-bus-ingest");
          const oidcResponse = await fetch(oidcUrl, { headers: { Authorization: `Bearer ${requestToken}` } });
          const oidc = await oidcResponse.json();
          if (!oidcResponse.ok || !oidc.value) throw new Error("GitHub OIDC token request failed.");
          const response = await fetch("https://mdmuxzaewqzqutkqdylo.supabase.co/functions/v1/dakar-bus-osm-stops-sync", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": key,
              "x-github-oidc-token": oidc.value
            },
            body: JSON.stringify({ mode: "auth_check" })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || result.ok !== true || result.authenticated !== true) {
            throw new Error("Supabase OIDC preflight failed: HTTP " + response.status + " " + JSON.stringify(result));
          }
          console.log("Supabase OIDC authentication: OK");
          NODE
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool
      - name: Download, filter and import Dakar bus stops
        env:
          DAKAR_BUS_PUBLISHABLE_KEY: ${{ secrets.DAKAR_BUS_PUBLISHABLE_KEY }}
        run: node scripts/import_dakar_osm_geofabrik.mjs
