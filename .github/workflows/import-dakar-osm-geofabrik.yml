name: Import Dakar OSM bus stops from Geofabrik

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: dakar-bus-osm-geofabrik-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Supabase ingest authentication before OSM download
        env:
          DAKAR_BUS_INGEST_TOKEN: ${{ secrets.DAKAR_BUS_INGEST_TOKEN }}
          DAKAR_BUS_PUBLISHABLE_KEY: ${{ secrets.DAKAR_BUS_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const raw = (process.env.DAKAR_BUS_INGEST_TOKEN ?? "").replace(/\s+/g, "");
          const token = /^[0-9a-fA-F]{144}$/.test(raw)
            ? Buffer.from(raw, "hex").toString("utf8")
            : raw;
          const key = process.env.DAKAR_BUS_PUBLISHABLE_KEY ?? "";
          if (!token || !key) throw new Error("Missing OSM ingestion credentials.");
          console.log("Normalized ingest token length:", token.length);
          const response = await fetch("https://mdmuxzaewqzqutkqdylo.supabase.co/functions/v1/dakar-bus-osm-stops-sync", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": key,
              "x-dakar-bus-ingest-token": token
            },
            body: JSON.stringify({ mode: "auth_check" })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || result.ok !== true || result.authenticated !== true) {
            throw new Error("Supabase authentication preflight failed: HTTP " + response.status + " " + JSON.stringify(result));
          }
          console.log("Supabase ingest authentication: OK");
          NODE
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool
      - name: Download, filter and import Dakar bus stops
        env:
          DAKAR_BUS_INGEST_TOKEN: ${{ secrets.DAKAR_BUS_INGEST_TOKEN }}
          DAKAR_BUS_PUBLISHABLE_KEY: ${{ secrets.DAKAR_BUS_PUBLISHABLE_KEY }}
        run: node scripts/import_dakar_osm_geofabrik.mjs
