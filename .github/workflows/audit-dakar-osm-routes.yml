name: Audit Dakar OSM bus routes (read only)
# Directional pair extraction is retained as a separate, read-only artifact.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/export_dakar_osm_routes.mjs"
      - "scripts/analyze_dakar_osm_directional_pairs.mjs"
      - "scripts/build_aftu_tata_osm_stop_crosswalk.node.mjs"
      - "scripts/build_aftu_tata_osm_stop_crosswalk.node-test.mjs"
      - "src/data/mobility-lines.json"
      - "src/data/tata-lines.json"
      - "src/data/aftu-*.json"
      - ".github/workflows/audit-dakar-osm-routes.yml"

permissions:
  contents: read

concurrency:
  group: dakar-bus-osm-route-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retrieve OSM route relations and ordered stops
        id: osm_export
        continue-on-error: true
        run: node scripts/export_dakar_osm_routes.mjs
      - name: Analyze directional route pairs without merging directions
        if: steps.osm_export.outcome == 'success'
        run: node scripts/analyze_dakar_osm_directional_pairs.mjs
      - name: Check AFTU/TATA OSM stop crosswalk
        if: steps.osm_export.outcome == 'success'
        run: node --check scripts/build_aftu_tata_osm_stop_crosswalk.node.mjs
      - name: Test AFTU/TATA OSM stop crosswalk
        if: steps.osm_export.outcome == 'success'
        run: node --test scripts/build_aftu_tata_osm_stop_crosswalk.node-test.mjs
      - name: Build AFTU/TATA OSM stop crosswalk
        if: steps.osm_export.outcome == 'success'
        run: node scripts/build_aftu_tata_osm_stop_crosswalk.node.mjs
      - name: Upload AFTU/TATA OSM stop crosswalk
        if: steps.osm_export.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aftu-tata-osm-stop-crosswalk
          path: artifacts/aftu-tata/osm-stop-crosswalk*
          if-no-files-found: error
          retention-days: 30
      - name: Save the read-only audit or source outage diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dakar-osm-route-candidates
          path: |
            artifacts/osm/dakar-osm-route-candidates.json
            artifacts/osm/dakar-osm-directional-pairs.json
            artifacts/osm/dakar-osm-fetch-failure.json
          if-no-files-found: warn
          retention-days: 14
