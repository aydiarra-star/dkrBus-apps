name: Audit Dakar OSM bus routes (read only)
# Directional pair extraction is retained as a separate, read-only artifact.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/export_dakar_osm_routes.mjs"
      - "scripts/analyze_dakar_osm_directional_pairs.mjs"
      - ".github/workflows/audit-dakar-osm-routes.yml"

permissions:
  contents: read

concurrency:
  group: dakar-bus-osm-route-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retrieve OSM route relations and ordered stops
        run: node scripts/export_dakar_osm_routes.mjs
      - name: Analyze directional route pairs without merging directions
        run: node scripts/analyze_dakar_osm_directional_pairs.mjs
      - name: Save the read-only audit
        uses: actions/upload-artifact@v4
        with:
          name: dakar-osm-route-candidates
          path: |
            artifacts/osm/dakar-osm-route-candidates.json
            artifacts/osm/dakar-osm-directional-pairs.json
          if-no-files-found: error
          retention-days: 14
